[package]
name = "p0-tauri"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "p0_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# WebView2 controller'ina erisim icin. Surum tauri 2.11.5'in kullandigi
# webview2-com 0.38.2 ile AYNI olmak zorunda; farkli olsa `PlatformWebview::
# controller()`'in dondugu tip bizim tipimizle uyusmaz.
webview2-com = "0.38"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Performance",
  "Win32_UI_WindowsAndMessaging",
] }


# SAC (Smart App Control) build script ikililerini hash basina engelleyebiliyor
# (bkz. CLAUDE.md → "Smart App Control"). Build script'leri farkli bayraklarla
# derlemek farkli bir hash uretiyor ve engeli asiyor; islevsel etkisi yok.
[profile.dev.build-override]
opt-level = 1

# NOT: release icin build-override YOK. P0 kosusu bu profille derlendi ve
# `target/release` altindaki build script ikilileri SAC tarafindan zaten
# gecirilmis durumda; profili degistirmek hepsini yeni hash'le yeniden
# derletiyor ve engel rastgele geri geliyor.
